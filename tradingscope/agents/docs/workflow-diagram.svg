<svg width="1200" height="900" xmlns="http://www.w3.org/2000/svg">
  <style>
    .agent { fill: #4A90E2; stroke: #2C6CB0; stroke-width: 2; }
    .manager { fill: #7ED321; stroke: #4A8C14; stroke-width: 2; }
    .trader { fill: #F5A623; stroke: #C77D1B; stroke-width: 2; }
    .risk { fill: #D0021B; stroke: #9B0115; stroke-width: 2; }
    .orchestrator { fill: #BD10E0; stroke: #8A0DA0; stroke-width: 2; }
    .connector { stroke: #999; stroke-width: 2; marker-end: url(#arrowhead); }
    .phase-bg { fill: #f8f9fa; stroke: #ddd; stroke-width: 1; rx: 10; ry: 10; }
    .phase-title { font: bold 16px sans-serif; fill: #333; }
    .agent-label { font: 12px sans-serif; fill: #fff; text-anchor: middle; dominant-baseline: middle; }
    .process-label { font: 14px sans-serif; fill: #333; text-anchor: middle; }
  </style>
  
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#999" />
    </marker>
  </defs>

  <!-- Phase 1: Analysis -->
  <rect x="50" y="20" width="1100" height="120" class="phase-bg"/>
  <text x="600" y="40" class="phase-title">1. ANALYSIS PHASE (Concurrent)</text>
  
  <rect x="150" y="70" width="180" height="50" class="agent"/>
  <text x="240" y="95" class="agent-label">Market Analyst</text>
  
  <rect x="350" y="70" width="180" height="50" class="agent"/>
  <text x="440" y="95" class="agent-label">Fundamentals Analyst</text>
  
  <rect x="550" y="70" width="180" height="50" class="agent"/>
  <text x="640" y="95" class="agent-label">News Analyst</text>
  
  <rect x="750" y="70" width="180" height="50" class="agent"/>
  <text x="840" y="95" class="agent-label">Social Media Analyst</text>

  <!-- Arrow from Analysis to Research Debate -->
  <line x1="600" y1="140" x2="600" y2="170" class="connector"/>

  <!-- Phase 2: Research Debate -->
  <rect x="50" y="170" width="1100" height="200" class="phase-bg"/>
  <text x="600" y="190" class="phase-title">2. RESEARCH DEBATE PHASE</text>
  
  <rect x="500" y="210" width="200" height="50" class="orchestrator"/>
  <text x="600" y="235" class="agent-label">Research Debate Orchestrator</text>
  
  <rect x="350" y="280" width="180" height="50" class="agent"/>
  <text x="440" y="305" class="agent-label">Bull Researcher</text>
  
  <rect x="670" y="280" width="180" height="50" class="agent"/>
  <text x="760" y="305" class="agent-label">Bear Researcher</text>
  
  <rect x="500" y="350" width="200" height="50" class="manager"/>
  <text x="600" y="375" class="agent-label">Research Manager</text>
  
  <!-- Connectors within Research Debate -->
  <line x1="600" y1="260" x2="440" y2="280" class="connector"/>
  <line x1="600" y1="260" x2="760" y2="280" class="connector"/>
  <line x1="440" y1="330" x2="600" y2="350" class="connector"/>
  <line x1="760" y1="330" x2="600" y2="350" class="connector"/>

  <!-- Arrow from Research Debate to Trading Decision -->
  <line x1="600" y1="420" x2="600" y2="470" class="connector"/>

  <!-- Phase 3: Trading Decision -->
  <rect x="50" y="470" width="1100" height="100" class="phase-bg"/>
  <text x="600" y="490" class="phase-title">3. TRADING DECISION PHASE</text>
  
  <rect x="500" y="510" width="200" height="50" class="trader"/>
  <text x="600" y="535" class="agent-label">Trader</text>

  <!-- Arrow from Trading Decision to Risk Assessment -->
  <line x1="600" y1="620" x2="600" y2="670" class="connector"/>

  <!-- Phase 4: Risk Assessment -->
  <rect x="50" y="670" width="1100" height="200" class="phase-bg"/>
  <text x="600" y="690" class="phase-title">4. RISK ASSESSMENT PHASE</text>
  
  <rect x="500" y="710" width="200" height="50" class="orchestrator"/>
  <text x="600" y="735" class="agent-label">Risk Debate Orchestrator</text>
  
  <rect x="250" y="780" width="180" height="50" class="risk"/>
  <text x="340" y="805" class="agent-label">Aggressive Debator</text>
  
  <rect x="510" y="780" width="180" height="50" class="risk"/>
  <text x="600" y="805" class="agent-label">Conservative Debator</text>
  
  <rect x="770" y="780" width="180" height="50" class="risk"/>
  <text x="860" y="805" class="agent-label">Neutral Debator</text>
  
  <rect x="500" y="850" width="200" height="50" class="manager"/>
  <text x="600" y="875" class="agent-label">Risk Manager</text>
  
  <!-- Connectors within Risk Assessment -->
  <line x1="600" y1="760" x2="340" y2="780" class="connector"/>
  <line x1="600" y1="760" x2="600" y2="780" class="connector"/>
  <line x1="600" y1="760" x2="860" y2="780" class="connector"/>
  <line x1="340" y1="830" x2="600" y2="850" class="connector"/>
  <line x1="600" y1="830" x2="600" y2="850" class="connector"/>
  <line x1="860" y1="830" x2="600" y2="850" class="connector"/>
</svg>