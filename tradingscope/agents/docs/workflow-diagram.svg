<svg width="1200" height="1050" xmlns="http://www.w3.org/2000/svg">
  <style>
    .agent { fill: #4A90E2; stroke: #2C6CB0; stroke-width: 2; }
    .manager { fill: #7ED321; stroke: #4A8C14; stroke-width: 2; }
    .trader { fill: #F5A623; stroke: #C77D1B; stroke-width: 2; }
    .risk { fill: #D0021B; stroke: #9B0115; stroke-width: 2; }
    .orchestrator { fill: #BD10E0; stroke: #8A0DA0; stroke-width: 2; }
    .connector { stroke: #999; stroke-width: 2; marker-end: url(#arrowhead); }
    .phase-bg { fill: #f8f9fa; stroke: #ddd; stroke-width: 1; rx: 10; ry: 10; }
    .phase-title { font: bold 16px sans-serif; fill: #333; }
    .agent-label { font: 12px sans-serif; fill: #fff; text-anchor: middle; dominant-baseline: middle; }
    .process-label { font: 14px sans-serif; fill: #333; text-anchor: middle; }
  </style>
  
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#999" />
    </marker>
  </defs>

  <!-- Phase 1: Analysis -->
  <rect x="50" y="20" width="1100" height="140" class="phase-bg"/>
  <text x="600" y="40" class="phase-title">1. ANALYSIS PHASE (Concurrent)</text>
  
  <rect x="100" y="70" width="160" height="50" class="agent"/>
  <text x="180" y="95" class="agent-label">Market Analyst</text>
  
  <rect x="280" y="70" width="160" height="50" class="agent"/>
  <text x="360" y="95" class="agent-label">Fundamentals Analyst</text>
  
  <rect x="460" y="70" width="160" height="50" class="agent"/>
  <text x="540" y="95" class="agent-label">News Analyst</text>
  
  <rect x="640" y="70" width="160" height="50" class="agent"/>
  <text x="720" y="95" class="agent-label">Social Media Analyst</text>
  
  <rect x="820" y="70" width="160" height="50" class="agent"/>
  <text x="900" y="95" class="agent-label">Equity Analyst</text>

  <!-- Arrow from Analysis to Research Debate -->
  <line x1="600" y1="160" x2="600" y2="190" class="connector"/>

  <!-- Phase 2: Research Debate -->
  <rect x="50" y="190" width="1100" height="200" class="phase-bg"/>
  <text x="600" y="210" class="phase-title">2. RESEARCH DEBATE PHASE</text>
  
  <rect x="500" y="230" width="200" height="50" class="orchestrator"/>
  <text x="600" y="255" class="agent-label">Research Debate Orchestrator</text>
  
  <rect x="350" y="300" width="180" height="50" class="agent"/>
  <text x="440" y="325" class="agent-label">Bull Researcher</text>
  
  <rect x="670" y="300" width="180" height="50" class="agent"/>
  <text x="760" y="325" class="agent-label">Bear Researcher</text>
  
  <!-- Connectors within Research Debate -->
  <line x1="600" y1="280" x2="440" y2="300" class="connector"/>
  <line x1="600" y1="280" x2="760" y2="300" class="connector"/>

  <!-- Arrow from Research Debate to Research Management -->
  <line x1="600" y1="390" x2="600" y2="420" class="connector"/>
  
  <!-- Phase 3: Research Management -->
  <rect x="50" y="420" width="1100" height="100" class="phase-bg"/>
  <text x="600" y="440" class="phase-title">3. RESEARCH MANAGEMENT PHASE</text>
  
  <rect x="500" y="460" width="200" height="50" class="manager"/>
  <text x="600" y="485" class="agent-label">Research Manager</text>

  <!-- Arrow from Research Management to Trading Decision -->
  <line x1="600" y1="520" x2="600" y2="550" class="connector"/>

  <!-- Phase 3: Trading Decision -->
  <rect x="50" y="550" width="1100" height="100" class="phase-bg"/>
  <text x="600" y="570" class="phase-title">4. TRADING DECISION PHASE</text>
  
  <rect x="500" y="590" width="200" height="50" class="trader"/>
  <text x="600" y="615" class="agent-label">Trader</text>

  <!-- Arrow from Trading Decision to Risk Assessment -->
  <line x1="600" y1="650" x2="600" y2="680" class="connector"/>

  <!-- Phase 4: Risk Assessment -->
  <rect x="50" y="680" width="1100" height="200" class="phase-bg"/>
  <text x="600" y="700" class="phase-title">5. RISK ASSESSMENT DEBATE PHASE</text>
  
  <rect x="500" y="720" width="200" height="50" class="orchestrator"/>
  <text x="600" y="745" class="agent-label">Risk Debate Orchestrator</text>
  
  <rect x="250" y="790" width="180" height="50" class="risk"/>
  <text x="340" y="815" class="agent-label">Aggressive Debator</text>
  
  <rect x="510" y="790" width="180" height="50" class="risk"/>
  <text x="600" y="815" class="agent-label">Conservative Debator</text>
  
  <rect x="770" y="790" width="180" height="50" class="risk"/>
  <text x="860" y="815" class="agent-label">Neutral Debator</text>
  
  <!-- Connectors within Risk Assessment -->
  <line x1="600" y1="770" x2="340" y2="790" class="connector"/>
  <line x1="600" y1="770" x2="600" y2="790" class="connector"/>
  <line x1="600" y1="770" x2="860" y2="790" class="connector"/>
  
  <!-- Arrow from Risk Debate to Risk Management -->
  <line x1="600" y1="880" x2="600" y2="910" class="connector"/>
  
  <!-- Phase 5: Risk Management -->
  <rect x="50" y="910" width="1100" height="100" class="phase-bg"/>
  <text x="600" y="930" class="phase-title">6. RISK MANAGEMENT PHASE</text>
  
  <rect x="500" y="950" width="200" height="50" class="manager"/>
  <text x="600" y="975" class="agent-label">Portfolio Manager</text>
</svg>