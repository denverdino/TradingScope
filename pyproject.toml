[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tradingscope"
version = "0.1.0"
description = "Multi-Agents trading framework with AgentScope"
readme = "README.md"
authors = [
    {name = "Yi Li", email = "denverdino@gmail.com"}
]
license = {text = "MIT"}
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
requires-python = ">=3.11"
dependencies = [
    "agentscope>=1.0.15",
    "agentscope-runtime>=1.1.0",
    "dashscope>=1.20.0",
    "yfinance>=0.2.66",
    "pandas>=2.3.3",
    "numpy>=2.3.3",
    "tushare>=1.4.24",
    "requests>=2.32.5",
    "beautifulsoup4>=4.14.2",
    "lxml>=6.0.2",
    "feedparser>=6.0.12",
    "praw>=7.8.1",
    "newspaper3k>=0.2.8",
    "stockstats>=0.6.5",
    "finnhub-python>=2.4.25",
    "tqdm>=4.67.1",
    "toml>=0.10.2",
    "cachetools>=5.3.2",
    "tenacity>=8.2.3",
    "pytdx>=1.8.6",
    "markdown>=3.4.0",
    "alibabacloud-oss-v2>=1.2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "ruff>=0.1.0",
    "mypy>=1.0.0",
    "pre-commit>=3.0.0",
    "jupyter>=1.0.0",
    "matplotlib>=3.5.0",
    "seaborn>=0.11.0",
    "pytest-asyncio>=1.2.0",
]

[project.urls]
Homepage = "https://github.com/denverdino/tradingscope"
Repository = "https://github.com/denverdino/tradingscope"

[project.scripts]
tradingscope = "tradingscope.main:main"
tradingscope-evaluate = "tradingscope.evaluate:main"

[tool.hatch.build.targets.wheel]
packages = ["tradingscope"]

[tool.ruff]
line-length = 160
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort
    "C",  # flake8-comprehensions
    "B",  # flake8-bugbear
]
ignore = ["E501", "C901", "F841", "E722", "B007", "B904", "F401"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --strict-markers --strict-config --tb=short"
markers = [
    "slow: marks tests as slow",
    "integration: marks tests as integration tests",
]