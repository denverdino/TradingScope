name: Trading Analysis

on:
  schedule:
    # 8 AM Beijing time (0 AM UTC)
    - cron: '0 0 * * *'
    # 6 PM Beijing time (10 AM UTC)
    - cron: '0 10 * * *'
  workflow_dispatch: # Allows manual triggering

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip list

      - name: Run stock analysis
        run: |
          tickers=(MSFT AAPL TSLA AMZN META NVDA GOOGL BABA TSM)
          for ticker in "${tickers[@]}"; do
            python -m tradingscope.main "$ticker" --email_to="${{ secrets.EMAIL_TO }}" || echo "Analyze stock $ticker failed, continuing..."
          done
        env:
          DASHSCOPE_API_KEY: ${{ secrets.DASHSCOPE_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_BASE_URL: https://dashscope.aliyuncs.com/compatible-mode/v1
          ALPHA_VANTAGE_API_KEY: ${{ secrets.ALPHA_VANTAGE_API_KEY }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
          PERPLEXITY_API_KEY: ${{ secrets.PERPLEXITY_API_KEY }}
          OSS_ACCESS_KEY_ID: ${{ secrets.OSS_ACCESS_KEY_ID }}
          OSS_ACCESS_KEY_SECRET: ${{ secrets.OSS_ACCESS_KEY_SECRET }}
          OSS_REGION: ${{ secrets.OSS_REGION }}
          OSS_BUCKET: ${{ secrets.OSS_BUCKET }}
          TZ: Asia/Shanghai
          MEMORY_DEBUG: "1"
